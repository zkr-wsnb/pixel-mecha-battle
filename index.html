<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>像素机甲对战 - 帧数据格斗 v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;touch-action:none;user-select:none;-webkit-user-select:none}

canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;border:2px solid #334;border-radius:4px;cursor:pointer}

  #charSel{bottom:4px;gap:4px}
  #charSel button{padding:3px 6px;font-size:9px}
}
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="gc"></canvas>
  <div id="ui">
    <div id="info">⚡ 像素机甲对战 v2 · <a href="#" id="pvpLink">联机匹配</a> · <a href="#" id="resetLink">重开</a> · <a href="#" id="trainLink">训练</a></div>
    <div id="status">单人模式 (AI) · [T训练] [R重开]</div>
    <button id="modeBtn">触控: 关</button>
    <div id="charSel">
      <button data-char="0" class="active">重甲 Tager</button>
      <button data-char="1">平衡 Ragna</button>
      <button data-char="2">速攻 Jin</button>
      <button data-char="3">灵巧 Carl</button>
    </div>
    <div id="controls">
      W/↑跳  A/←  D/→  S/↓防<br>
      J轻击 H重击 U下段<br>
      K特殊 L翻滚 I技能
    </div>
  </div>
</div>
<script>
/* ============================================================
   像素机甲对战 v2 - 帧数据格斗系统
   参考《苍翼默示录》BlazBlue 设计:
   - 角色差异化 (HP/Guard/修正/速度)
   - 5种招式帧数据 (启动/持续/恢复/有利帧)
   - 伤害修正 (基底+乘算+同技修正)
   - 破招 / 致命破招
   - 防御槽 / 破防 (Guard Break)
   - 训练模式 (Hitbox/帧数据/伤害浮字)
   - AI 连招/防御/翻滚
   - Web Audio 音效
   ============================================================ */

/* ===== 画布尺寸 ===== */
const W = 720, H = 400;
const SCL = 1;

const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');
canvas.width = W;
canvas.height = H;

/* ===== 游戏常量 ===== */
const GRAVITY = 0.38;
const GROUND_Y = 345;
const MECH_W = 32, MECH_H = 44;

/* ============================================================
   1. 角色差异化数值系统 (参考 BlazBlue CS)
   ============================================================ */
const CHARS = [
  { // [0] 重甲型 - Tager 风格: 血厚、攻击猛、速度慢、修正低
    name:'Tager 重甲', color:'#b03030', hp:130, maxGuard:140,
    baseDmgScale:0.55, speedMul:0.72, jumpMul:0.85,
    desc:'HP 130 · 高防御 · 低修正'
  },
  { // [1] 平衡型 - Ragna 风格: 标准
    name:'Ragna 标准', color:'#e04040', hp:105, maxGuard:100,
    baseDmgScale:0.85, speedMul:1.0, jumpMul:1.0,
    desc:'HP 105 · 均衡数值'
  },
  { // [2] 速攻型 - Jin 风格: 稍血厚、速度快
    name:'Jin 速攻', color:'#3080e0', hp:115, maxGuard:115,
    baseDmgScale:0.92, speedMul:1.12, jumpMul:1.08,
    desc:'HP 115 · 高机动'
  },
  { // [3] 灵巧型 - Carl 风格: 血少、修正高、最灵活
    name:'Carl 灵巧', color:'#8040c0', hp:95, maxGuard:95,
    baseDmgScale:1.05, speedMul:1.2, jumpMul:1.15,
    desc:'HP 95 · 高伤害修正'
  }
];

/* ============================================================
   2. 招式帧数据定义 (基于 60fps)
   每招: startup / active / recovery / damage / kb / hitstun / FA(有利帧)
   FA = recovery - opponent.hitstun_frames ; 负值=我方有利
   ============================================================ */
const ATK_DATA = {
  jab:     { startup:4,  active:5,  recovery:8,  damage:10, knockback:1.8, hitstun:0.20, blockstun:0.10, fa:-2,  low:false },
  heavy:   { startup:10, active:3,  recovery:14, damage:24, knockback:3.0, hitstun:0.38, blockstun:0.18, fa:+5,  low:false },
  sweep:   { startup:7,  active:4,  recovery:16, damage:16, knockback:2.2, hitstun:0.28, blockstun:0.14, fa:-5,  low:true  },
  special: { startup:15, active:6,  recovery:20, damage:32, knockback:4.0, hitstun:0.50, blockstun:0.22, fa:+8,  low:false },
  beam:    { startup:8,  active:0,  recovery:12, damage:16, knockback:2.0, hitstun:0.26, blockstun:0.14, fa:0,   low:false },
};
const ATK_NAMES = { jab:'轻击Jab', heavy:'重击Heavy', sweep:'下段Sweep', special:'特殊Special', beam:'能量炮Beam' };

/* ============================================================
   3. 像素精灵定义 (16x18 -> 放大到屏幕)
   ============================================================ */
const _ = 0, R = 1, O = 2, Y = 3, G = 4, B = 5, P = 6, W2 = 7, D = 8;

const SPR_IDLE = [
  [_,_,_,_,R,R,R,R,R,R,_,_,_,_,_,_],
  [_,_,_,R,R,R,R,R,R,R,R,R,_,_,_,_],
  [_,_,_,R,R,R,R,R,R,R,R,R,_,_,_,_],
  [_,_,R,R,O,O,R,R,R,R,O,O,R,R,_,_],
  [_,_,R,R,O,O,R,R,R,R,O,O,R,R,_,_],
  [_,_,R,R,R,R,R,R,R,R,R,R,R,R,_,_],
  [_,_,R,R,R,R,R,R,R,R,R,R,R,R,_,_],
  [_,_,_,R,R,R,R,R,R,R,R,R,R,_,_,_],
  [_,_,_,R,R,R,R,R,R,R,R,R,R,_,_,_],
  [_,_,_,_,R,R,R,G,G,R,R,R,_,_,_,_],
  [_,_,_,_,R,R,G,G,G,G,R,R,_,_,_,_],
  [_,_,_,_,R,R,G,G,G,G,R,R,_,_,_,_],
  [_,_,_,_,R,R,R,G,G,R,R,R,_,_,_,_],
  [_,_,_,_,_,R,R,R,R,R,R,_,_,_,_,_],
  [_,_,_,_,_,_,R,R,R,R,_,_,_,_,_,_],
  [_,_,_,_,_,R,R,R,R,R,R,_,_,_,_,_],
  [_,_,_,_,R,R,R,R,R,R,R,R,_,_,_,_],
  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],
];
const SPR_WALK1 = [...SPR_IDLE];
const SPR_WALK2 = [...SPR_IDLE];
const SPR_JUMP = [...SPR_IDLE];
const SPR_ATTACK = [
  [_,_,_,_,R,R,R,R,R,R,_,_,_,_,_,_],
  [_,_,_,R,R,R,R,R,R,R,R,R,_,_,_,_],
  [_,_,R,R,R,R,R,R,R,R,R,R,R,R,_,_],
  [_,_,R,R,O,O,R,R,R,R,O,O,R,R,_,_],
  [_,_,R,R,O,O,R,R,R,R,O,O,R,R,_,_],
  [_,_,R,R,R,R,R,R,R,R,R,R,R,R,_,_],
  [_,_,_,R,R,R,R,R,R,R,R,R,R,R,R,R],
  [_,_,_,R,R,R,R,R,R,R,R,R,R,R,R,R],
  [_,_,_,_,R,R,R,R,R,R,R,R,R,R,R,_],
  [_,_,_,_,R,R,R,R,G,G,R,R,R,R,_,_],
  [_,_,_,_,R,R,R,G,G,G,G,R,R,R,_,_],
  [_,_,_,_,R,R,R,G,G,G,G,R,R,_,_,_],
  [_,_,_,_,_,R,R,R,R,G,G,R,R,_,_,_],
  [_,_,_,_,_,R,R,R,R,R,R,R,R,_,_,_],
  [_,_,_,_,_,_,R,R,R,R,R,_,_,_,_,_],
  [_,_,_,_,_,_,R,R,R,R,_,_,_,_,_,_],
  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],
  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],
];
const SPR_ROLL = [...SPR_IDLE];
const SPR_HURT = [...SPR_IDLE];

function makePal(baseColor){
  // 根据角色基础色生成调色板
  const dark = shade(baseColor, -0.35);
  const mid  = shade(baseColor, -0.15);
  const light= shade(baseColor, 0.15);
  const hi   = shade(baseColor, 0.35);
  return [0,'#111',dark,mid,light,hi,'#ccc','#fff','#000'];
}
function shade(hex, amt){
  const c = hex.replace('#','');
  let r = parseInt(c.substr(0,2),16);
  let g = parseInt(c.substr(2,2),16);
  let b = parseInt(c.substr(4,2),16);
  r = Math.max(0,Math.min(255, Math.round(r + 255*amt)));
  g = Math.max(0,Math.min(255, Math.round(g + 255*amt)));
  b = Math.max(0,Math.min(255, Math.round(b + 255*amt)));
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

const S1 = { idle:SPR_IDLE, walk1:SPR_WALK1, walk2:SPR_WALK2, jump:SPR_JUMP, attack:SPR_ATTACK, roll:SPR_ROLL, hurt:SPR_HURT };

/* ===== 工具 ===== */
function aabb(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

/* ============================================================
   4. 粒子系统 + 伤害浮字
   ============================================================ */
class Particle{
  constructor(o){
    this.x=o.x; this.y=o.y; this.vx=o.vx||0; this.vy=o.vy||0;
    this.s=o.s||2; this.color=o.color||'#fff';
    this.life=o.life||0.3; this.maxLife=this.life;
    this.gravity = o.gravity!==undefined?o.gravity:0.08;
  }
  update(dt){
    this.x+=this.vx; this.y+=this.vy;
    this.vy+=this.gravity; this.life-=dt;
  }
  get dead(){ return this.life<=0; }
  get alpha(){ return Math.max(0,this.life/this.maxLife); }
}
class FloatText{
  constructor(o){
    this.x=o.x; this.y=o.y; this.text=o.text; this.color=o.color||'#fff';
    this.vy = o.vy || -1.2; this.life = o.life || 0.8; this.maxLife=this.life;
    this.size = o.size || 14; this.weight = o.weight||'bold';
  }
  update(dt){ this.y += this.vy; this.vy *= 0.96; this.life -= dt; }
  get dead(){ return this.life<=0; }
  get alpha(){ return clamp(this.life/this.maxLife,0,1); }
}

/* ===== 光束 ===== */
class Beam{
  constructor(o){
    this.x=o.x; this.y=o.y; this.vx=o.vx;
    this.owner=o.owner; this.w=28; this.h=5;
    this.life=2.5; this.dealt=false;
  }
  update(dt, world){
    this.x+=this.vx; this.life-=dt;
    if(this.life<=0) return;
    for(const m of world.mechas){
      if(m===this.owner||m.dead||m.invuln>0) continue;
      if(aabb({x:this.x,y:this.y,w:this.w,h:this.h}, m.hurtBox())){
        if(!this.dealt){
          this.dealt=true;
          const data = ATK_DATA.beam;
          let isCounter = (m.atkPhase==='startup' || m.state==='attack');
          let dmg = Math.floor(data.damage * this.owner.dmgScale);
          // 同技修正
          if(this.owner.lastMove==='beam') dmg = Math.floor(dmg*0.75);
          if(isCounter) dmg = Math.floor(dmg*1.5);
          dmg = Math.max(3, dmg);
          m.takeDamage(dmg, this.vx>0?1:-1, world, isCounter, 'beam');
          this.owner.vx -= (this.vx>0?1:-1)*data.knockback*0.3;
          this.owner.comboCount++;
          this.owner.dmgScale = Math.max(0.3, this.owner.dmgScale*0.88);
          this.owner.comboTimer = 0.45;
          this.owner.lastMove = 'beam';
        }
        this.life=-1;
        for(let i=0;i<8;i++) world.parts.push(new Particle({
          x:this.x+this.w/2,y:this.y+this.h/2,
          vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5,
          s:2,color:'#6cf',life:0.25+Math.random()*0.2,gravity:0
        }));
        break;
      }
    }
  }
  get dead(){ return this.life<=0; }
}

/* ============================================================
   5. 机甲类 (帧数据驱动 + 角色差异化)
   ============================================================ */
class Mech{
  constructor(o){
    const ch = CHARS[o.charIdx] || CHARS[0];
    this.charIdx = o.charIdx;
    this.ch = ch;
    this.x=o.x; this.y=GROUND_Y-MECH_H;
    this.vx=0; this.vy=0; this.facing=o.dir;
    this.color=ch.color; this.pal = makePal(ch.color);
    this.name=o.name||ch.name;
    this.isAI=!!o.isAI;
    this.hp=ch.hp; this.maxhp=ch.hp;
    this.energy=100; this.maxEnergy=100;
    this.onGround=true; this.canDoubleJump=false;
    this.state='idle';
    this.rollTimer=0; this.rollCool=0; this.skillCool=0;
    this.hitFlash=0; this.invuln=0; this.dead=false;
    this.walkFrame=0; this.animTime=0;
    this.sets=S1;
    this.rollVx=0;
    // 帧数据系统
    this.atkType = null;
    this.atkPhase = null;
    this.atkFrame = 0;
    this.atkCool = 0;
    this.dealt = false;
    this.whiffed = false;
    // 连招与修正
    this.comboCount = 0;
    this.dmgScale = ch.baseDmgScale;
    this.comboTimer = 0;
    this.lastMove = null;
    // 防御槽
    this.guard = ch.maxGuard;
    this.maxGuard = ch.maxGuard;
    this.guardRegenDelay = 0;
    // 状态
    this.hitstunTimer = 0;
    this.blocking = false;
    // 训练模式用数据
    this.lastFa = null;
    this.lastHitType = null;
  }
  rects(){ return {x:this.x+3, y:this.y+2, w:MECH_W-6, h:MECH_H-2}; }
  hurtBox(){ return this.rects(); }
  attackBox(){
    if(!this.atkType || this.atkType==='beam') return null;
    const widths = { jab:14, heavy:20, sweep:22, special:26 };
    const heights= { jab:9,  heavy:11, sweep:7,  special:12 };
    const yOffs = { jab:6, heavy:4, sweep:MECH_H-14, special:3 };
    const r = (widths[this.atkType]||14);
    const h = (heights[this.atkType]||8);
    const yo = yOffs[this.atkType]||0;
    return this.facing>0
      ? {x:this.x+MECH_W-2, y:this.y+yo, w:r, h:h}
      : {x:this.x+2-r, y:this.y+yo, w:r, h:h};
  }

  update(dt, input, opp, world){
    if(this.dead) return;
    this.animTime+=dt;
    if(this.atkCool>0) this.atkCool-=dt;
    if(this.rollCool>0) this.rollCool-=dt;
    if(this.skillCool>0) this.skillCool-=dt;
    if(this.hitFlash>0) this.hitFlash-=dt;
    if(this.invuln>0) this.invuln-=dt;
    if(this.energy<this.maxEnergy) this.energy=Math.min(this.maxEnergy,this.energy+dt*12);

    // 防御槽回复
    if(this.guardRegenDelay>0) this.guardRegenDelay-=dt;
    else if(this.guard<this.maxGuard) this.guard=Math.min(this.maxGuard, this.guard+dt*10);

    // 帧数据攻击计时
    if(this.atkPhase){
      this.atkFrame++;
      const data = ATK_DATA[this.atkType];
      if(!data) { this.atkPhase=null; this.atkType=null; return; }
      const totalFrames = data.startup + data.active + data.recovery;
      if(this.atkFrame >= totalFrames){
        // 计算有利帧 (最后更新)
        if(this.dealt){
          this.lastFa = data.fa;
          this.lastHitType = this.dealt ? 'hit' : 'whiff';
        } else {
          this.lastFa = -data.recovery; // 挥空 = 全部恢复时间不利
          this.lastHitType = 'whiff';
        }
        this.atkPhase = null; this.atkType = null; this.atkFrame = 0;
        this.state = 'idle';
      } else if(this.atkFrame === data.startup){
        this.atkPhase = 'active';
        this.checkHit(opp, world, data);
      } else if(this.atkFrame === data.startup + data.active){
        this.atkPhase = 'recovery';
        if(!this.dealt) this.whiffed = true;
      }
    }

    // 受击硬直
    if(this.hitstunTimer>0){
      this.hitstunTimer-=dt;
      if(this.hitstunTimer<=0 && this.state==='hit'){
        this.state='idle';
        this.comboTimer=0;
      }
    }
    // 翻滚
    if(this.state==='roll'){
      this.rollTimer-=dt;
      if(this.rollTimer<=0){ this.state='idle'; this.vx=0; }
    }

    const canAct = !this.atkPhase && this.state!=='roll' && this.hitstunTimer<=0 && this.hitFlash<=0;
    const speedMul = this.ch.speedMul;

    // 防御
    this.blocking = false;
    if(canAct && input.down && this.onGround){
      this.blocking = true;
      this.state = 'block';
      this.vx = 0;
    }

    // 翻滚
    if(canAct && input.roll && this.rollCool<=0){
      this.state='roll'; this.rollTimer=0.42; this.rollCool=0.8;
      this.invuln=0.42; this.rollVx=this.facing*2.8*speedMul; this.vx=this.rollVx; this.vy=0;
      this.onGround=false;
      this.comboCount=0; this.dmgScale=this.ch.baseDmgScale; this.lastMove=null;
      for(let i=0;i<4;i++) world.parts.push(new Particle({
        x:this.x+MECH_W/2, y:this.y+MECH_H/2, vx:(Math.random()-0.5)*3, vy:(Math.random()-0.5)*3-1,
        s:2, color:'#fff', life:0.2+Math.random()*0.2
      }));
      return;
    }

    // 轻击 J
    if(canAct && input.attack && this.atkCool<=0 && !this.atkPhase){
      this.startAttack('jab', 0.42);
    }
    // 重击 H
    if(canAct && input.heavy && this.atkCool<=0 && !this.atkPhase){
      this.startAttack('heavy', 0.75);
    }
    // 下段 U
    if(canAct && input.sweep && this.atkCool<=0 && !this.atkPhase){
      this.startAttack('sweep', 0.6);
    }
    // 特殊技 K (消耗能量)
    if(canAct && input.special && this.energy>=50 && !this.atkPhase){
      this.energy-=50;
      this.startAttack('special', 1.1);
    }
    // 能量炮 I
    if(canAct && input.skill && this.skillCool<=0 && this.energy>=35 && !this.atkPhase){
      this.energy-=35; this.skillCool=1.8;
      const dir=this.facing;
      world.beams.push(new Beam({
        x:dir>0?this.x+MECH_W:this.x-22, y:this.y+6, vx:dir*4.2*speedMul, owner:this
      }));
      this.vx-=dir*1.0;
      for(let i=0;i<6;i++) world.parts.push(new Particle({
        x:this.x+MECH_W/2,y:this.y+8,vx:-dir*(1+Math.random()*2),vy:(Math.random()-0.5)*2,
        s:2,color:'#6cf',life:0.3+Math.random()*0.2,gravity:0
      }));
      this.lastMove='beam';
      this.state='attack';
      this.atkPhase='startup';
      this.atkType='beam';
      this.atkFrame=0;
      this.dealt=false;
      return;
    }

    // 移动
    if(canAct && !this.blocking){
      const sp = 0.95*speedMul;
      if(input.left){ this.vx=-sp; this.facing=-1; }
      else if(input.right){ this.vx=sp; this.facing=1; }
      else this.vx=0;

      if(input.up){
        const jv = 5.6*this.ch.jumpMul;
        if(this.onGround){ this.vy=-jv; this.onGround=false; this.canDoubleJump=true; }
        else if(this.canDoubleJump){ this.vy=-jv*0.92; this.canDoubleJump=false; this.onGround=false; }
      }
      if(input.down && !this.onGround) this.vy+=0.5;
    }

    if(this.state==='roll'){
      this.vx=this.rollVx;
      this.vy+=GRAVITY*0.5;
    }

    // 物理
    this.vy+=GRAVITY;
    this.x+=this.vx;
    this.y+=this.vy;
    if(this.y>=GROUND_Y-MECH_H){
      this.y=GROUND_Y-MECH_H; this.vy=0; this.onGround=true; this.canDoubleJump=false;
    }
    this.x=Math.max(6,Math.min(W-MECH_W-6,this.x));

    // 状态机
    if(!this.atkPhase && this.state!=='roll' && this.state!=='hit' && this.state!=='block'){
      if(!this.onGround) this.state='jump';
      else if(Math.abs(this.vx)>0.3) this.state='walk';
      else this.state='idle';
    }
    if(this.state==='walk') this.walkFrame+=dt*8;

    // 连击超时 -> 重置
    if(this.comboTimer>0){
      this.comboTimer-=dt;
      if(this.comboTimer<=0){
        this.comboCount=0;
        this.dmgScale=this.ch.baseDmgScale;
        this.lastMove=null;
      }
    }
  }

  startAttack(type, cool){
    this.atkType = type;
    this.atkPhase = 'startup';
    this.atkFrame = 0;
    this.dealt = false;
    this.whiffed = false;
    this.state = 'attack';
    this.atkCool = cool;
    // 重/特殊 攻击前摇粒子
    if(type==='heavy'||type==='special'){
      const cx=this.facing>0?this.x+MECH_W:this.x;
      const cy=this.y+6;
      for(let i=0;i<5;i++) world.parts.push(new Particle({
        x:cx,y:cy,vx:this.facing*(1+Math.random()*2),vy:(Math.random()-0.5)*2,
        s:3,color:this.pal[3],life:0.15,gravity:0
      }));
    }
  }

  checkHit(opp, world, data){
    if(this.dealt) return;
    const ab = this.attackBox();
    if(!ab) return;
    const hb = opp.hurtBox();
    if(!aabb(ab,hb) || opp.invuln>0) return;
    this.dealt = true;

    // 下段必须在地面才能被命中(防上段不能防下段)
    const isLow = data.low;
    const blockingEffective = opp.blocking && (!isLow || opp.onGround);

    if(blockingEffective){
      opp.guard = Math.max(0, opp.guard - data.damage*0.55);
      opp.guardRegenDelay = 0.55;
      opp.hitFlash = 0.08;
      opp.vx += this.facing * data.knockback*0.25;
      SFX.block();
      // 防御伤害浮字
      world.floats.push(new FloatText({
        x:opp.x+MECH_W/2, y:opp.y, text:`GUARD ${Math.floor(data.damage*0.55)}`,
        color:'#8af', size:12, vy:-1, life:0.6
      }));
      if(opp.guard<=0){
        opp.guard=0;
        SFX.guardBreak();
        opp.takeDamage(Math.floor(data.damage*1.5), this.facing, world, true, this.atkType);
        world.floats.push(new FloatText({
          x:opp.x+MECH_W/2, y:opp.y-18, text:'GUARD BREAK!',
          color:'#f44', size:14, vy:-1.5, life:1.0
        }));
        this.chainCombo(world);
      }
      return;
    }

    // 破招检测: 对手处于攻击启动帧 / 攻击中
    let isCounter = false;
    if(opp.atkPhase==='startup' || opp.atkPhase==='active' || opp.state==='attack'){
      isCounter = true;
    }
    // 致命破招: 特殊技启动帧
    let fatal = false;
    if(isCounter && opp.atkType==='special' && opp.atkPhase==='startup'){
      fatal = true;
    }

    // 伤害计算
    let finalDmg = Math.floor(data.damage * this.dmgScale);
    // 同技修正
    if(this.lastMove===this.atkType) finalDmg = Math.floor(finalDmg*0.8);
    if(isCounter) finalDmg = Math.floor(finalDmg*(fatal?1.8:1.5));
    finalDmg = Math.max(3, finalDmg);

    opp.takeDamage(finalDmg, this.facing, world, isCounter, this.atkType);
    if(fatal) world.floats.push(new FloatText({
      x:opp.x+MECH_W/2, y:opp.y-10, text:'致命破招!',
      color:'#f0f', size:15, vy:-2, life:0.9
    }));
    this.vx -= this.facing * data.knockback*0.3;

    // 连招
    this.comboCount++;
    this.dmgScale = Math.max(0.3, this.dmgScale*0.9);
    this.comboTimer = 0.45;
    this.lastMove = this.atkType;
  }

  chainCombo(world){
    this.comboCount++;
    this.dmgScale = Math.max(0.3, this.dmgScale*0.9);
    this.comboTimer = 0.45;
  }

  takeDamage(dmg, fromDir, world, isCounter, moveType){
    this.hp = Math.max(0, this.hp - dmg);
    this.hitFlash = 0.16;
    this.invuln = 0.3;
    this.state = 'hit';
    this.atkPhase = null; this.atkType = null;

    const data = ATK_DATA[moveType] || ATK_DATA.jab;
    const baseHitstun = data.hitstun;
    this.hitstunTimer = isCounter ? baseHitstun*1.6 : baseHitstun;
    this.vx = fromDir * data.knockback;
    this.vy = isCounter ? -3.8 : -2.6;
    this.onGround = false;

    // 受伤方重置连招(已经是敌方在连击，不用重置)
    // 但受伤方如果之前在连招，应该重置
    this.comboCount = 0;
    this.dmgScale = this.ch.baseDmgScale;

    // 特效 + 音效
    if(isCounter){
      world.shake = 10;
      SFX.counter();
      const cx=this.x+MECH_W/2, cy=this.y+MECH_H/2;
      for(let i=0;i<16;i++){
        const a=Math.random()*Math.PI*2, sp=2.5+Math.random()*5;
        world.parts.push(new Particle({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.2,
          s:3,color:['#b045f0','#ffd64a','#fff','#f44'][i%4],life:0.45+Math.random()*0.3}));
      }
    } else {
      world.shake = 5;
      SFX.hit();
      const cx=this.x+MECH_W/2, cy=this.y+MECH_H/2;
      for(let i=0;i<9;i++){
        const a=Math.random()*Math.PI*2, sp=1.2+Math.random()*3;
        world.parts.push(new Particle({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-0.8,
          s:2,color:['#ffe066','#ff8a1f','#ff5566'][i%3],life:0.3+Math.random()*0.3}));
      }
    }
    // 伤害浮字
    world.floats.push(new FloatText({
      x:this.x+MECH_W/2 + (Math.random()-0.5)*10,
      y:this.y-4,
      text:String(dmg),
      color: isCounter?'#f84':'#fff',
      size: isCounter?18:15,
      vy:-1.6, life:0.85
    }));
    if(this.hp<=0){ this.dead=true; this.state='idle'; SFX.defeat(); }
  }
}

   ============================================================ */
function drawSprite(spr, x, y, pal, flip){
  const rows = spr.length, cols = spr[0].length;
  const sx = (MECH_W - cols*SCL)/2;
  const sy = (MECH_H - rows*SCL);
  for(let row=0;row<rows;row++){
    for(let col=0;col<cols;col++){
      const c = spr[row][col]; if(c===0) continue;
      const px = flip ? (x+sx + (cols-1-col)*SCL) : (x+sx + col*SCL);
      const py = y+sy + row*SCL;
      ctx.fillStyle = pal[c] || '#f0f';
      ctx.fillRect(px|0, py|0, SCL, SCL);
    }
  }
}
function getMechSprite(mech){
  const s = mech.sets;
  if(mech.hitFlash>0 && Math.floor(mech.hitFlash*60)%5<3) return 'flash';
  if(mech.atkPhase) return s.attack;
  switch(mech.state){
    case 'walk': return (Math.floor(mech.walkFrame)%2===0)?s.walk1:s.walk2;
    case 'jump': return s.jump;
    case 'roll': return s.roll;
    case 'hit': return s.hurt;
    case 'block': return s.hurt;
    case 'attack': return s.attack;
    default: return s.idle;
  }
}
function drawMech(mech, training){
  const spr = getMechSprite(mech);
  if(spr==='flash'){
    // 白闪
    drawSprite(S1.idle, mech.x, mech.y, makePal('#ffffff'), mech.facing<0);
  } else if(spr){
    drawSprite(spr, mech.x, mech.y, mech.pal, mech.facing<0);
  }
  // 训练模式: 绘制Hitbox
  if(training){
    const hb = mech.hurtBox();
    ctx.strokeStyle = mech.blocking ? 'rgba(100,180,255,0.9)' : 'rgba(0,255,120,0.8)';
    ctx.lineWidth = 1;
    ctx.strokeRect(hb.x,hb.y,hb.w,hb.h);
    // 攻击判定框
    if(mech.atkPhase==='active' || (mech.atkPhase==='startup' && mech.atkFrame>ATK_DATA[mech.atkType]?.startup-2)){
      const ab = mech.attackBox();
      if(ab){
        ctx.fillStyle = 'rgba(255,60,80,0.35)';
        ctx.fillRect(ab.x,ab.y,ab.w,ab.h);
        ctx.strokeStyle = '#f33';
        ctx.strokeRect(ab.x,ab.y,ab.w,ab.h);
      }
    }
  }
}

function drawBackground(){

  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);

  // 星星
  for(let i=0;i<42;i++){
    const sx=(i*139+57)%W, sy=(i*101+17)%(GROUND_Y-60);
    const bright=0.35+((i*53)%100)/220;
    ctx.fillStyle=`rgba(200,220,255,${bright})`;
    const ss=((i*29)%3)+1;
    ctx.fillRect(sx,sy,ss,ss);
  }
  // 月亮
  ctx.fillStyle='#c9d0e8';
  ctx.beginPath();
  ctx.arc(600,55,34,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#181838';
  ctx.beginPath();
  ctx.arc(610,47,30,0,Math.PI*2);
  ctx.fill();

  // 远山
  ctx.fillStyle='#262646';
  ctx.beginPath();
  ctx.moveTo(0,GROUND_Y);
  ctx.lineTo(0,GROUND_Y-40);
  ctx.lineTo(80,GROUND_Y-75);
  ctx.lineTo(180,GROUND_Y-50);
  ctx.lineTo(280,GROUND_Y-95);
  ctx.lineTo(380,GROUND_Y-60);
  ctx.lineTo(490,GROUND_Y-85);
  ctx.lineTo(590,GROUND_Y-55);
  ctx.lineTo(W,GROUND_Y-70);
  ctx.lineTo(W,GROUND_Y);
  ctx.closePath(); ctx.fill();

  // 地面
  ctx.fillStyle='#24243a';
  ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);
  ctx.strokeStyle='#3a3a5e'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,GROUND_Y); ctx.lineTo(W,GROUND_Y); ctx.stroke();
  // 地面纹

  for(let i=0;i<24;i++){

  ctx.fillStyle='#2e2e48';
  ctx.fillRect(120,GROUND_Y-70,14,70);
  ctx.fillRect(560,GROUND_Y-50,12,50);
  ctx.fillStyle='#3e3e5e';
  ctx.fillRect(116,GROUND_Y-74,22,6);
  ctx.fillRect(556,GROUND_Y-54,20,6);
}

/* ============================================================
   7. Web Audio 音效系统
   ============================================================ */
const SFX = (function(){
  let ctxA=null;
  function ensure(){
    if(!ctxA) {
      try { ctxA = new (window.AudioContext||window.webkitAudioContext)(); }
      catch(e){ ctxA = null; }
    }
    return ctxA;
  }
  function beep(freq, dur, type, vol, slide){
    const ac = ensure(); if(!ac) return;
    if(ac.state==='suspended') ac.resume();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type||'square';
    o.frequency.value = freq;
    if(slide){
      o.frequency.linearRampToValueAtTime(freq*slide, ac.currentTime+dur);
    }
    g.gain.setValueAtTime(vol||0.1, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+dur);
    o.connect(g); g.connect(ac.destination);
    o.start();
    o.stop(ac.currentTime+dur+0.02);
  }
  return {
    hit(){ beep(260,0.07,'square',0.12,0.55); },
    counter(){ beep(160,0.05,'sawtooth',0.14); setTimeout(()=>beep(720,0.12,'square',0.13),20); },
    block(){ beep(520,0.05,'triangle',0.08); },
    guardBreak(){ beep(90,0.18,'sawtooth',0.18,0.5); setTimeout(()=>beep(220,0.22,'square',0.15),60); },
    defeat(){ beep(320,0.2,'square',0.15,0.4); setTimeout(()=>beep(160,0.35,'sawtooth',0.14,0.5),150); },
    swing(){ beep(780,0.035,'triangle',0.06,0.7); },
  };
})();

/* ============================================================
   8. 改进的 AI: 连招/防御/翻滚
   ============================================================ */
function aiInput(me, opp, dt, world){
  const input = { left:0, right:0, up:0, down:0, attack:0, heavy:0, sweep:0, special:0, skill:0, roll:0 };
  if(me.dead || me.atkPhase || me.state==='roll' || me.hitstunTimer>0) return input;

  const dx = opp.x - me.x;
  const dist = Math.abs(dx);
  const dir = dx>0?1:-1;
  const inHitboxRange = dist<48 && Math.abs(opp.y-me.y)<35;
  const oppAttacking = opp.atkPhase==='active' || opp.atkPhase==='startup';

  me.aiTimer = (me.aiTimer||0) - dt;
  me.aiComboTimer = (me.aiComboTimer||0) - dt;
  me.aiComboStep = me.aiComboStep||0;

  if(me.aiTimer<=0){
    me.aiDecision = Math.random();
    me.aiTimer = 0.15 + Math.random()*0.18;
  }

  // 1) 防御/翻滚: 对手攻击中
  if(oppAttacking){
    // 下段不能靠下蹲防, 需要翻滚
    const oppIsLow = opp.atkType==='sweep';
    if(opp.atkPhase==='startup' && me.onGround){
      if(Math.random()<0.55 && !oppIsLow){
        input.down = 1;
        return input;
      } else if(Math.random()<0.35){
        input.roll = 1;
        return input;
      }
    }
    if(opp.atkPhase==='active' && Math.random()<0.3 && me.rollCool<=0){
      input.roll = 1;
      return input;
    }
  }

  // 2) 连招AI: 基础连招链 jab -> jab -> heavy / sweep
  if(inHitboxRange && me.aiComboTimer<=0 && me.aiDecision>0.55){
    // 启动连招
    me.aiComboTimer = 0.9;
    me.aiComboStep = 1;
  }
  if(me.aiComboTimer>0 && !me.atkPhase){
    if(me.aiComboStep===1){
      input.attack = 1;
      me.aiComboStep = 2;
      me.aiComboWait = 0.28;
    } else if(me.aiComboStep===2){
      me.aiComboWait = (me.aiComboWait===undefined?0.28:me.aiComboWait) - dt;
      if(me.aiComboWait<=0){ input.attack = 1; me.aiComboStep = 3; me.aiComboWait = 0.4; }
    } else if(me.aiComboStep===3){
      me.aiComboWait -= dt;
      if(me.aiComboWait<=0){
        if(Math.random()<0.6) input.heavy = 1; else input.sweep = 1;
        me.aiComboStep = 0;
        me.aiComboTimer = 0;
      }
    }
    // 攻击时仍面向对手
    input[dir>0?'right':'left'] = 1;
    return input;
  }

  // 3) 朝向 + 距离调整
  const idealDist = 40;
  if(dist > idealDist+20) input[dir>0?'right':'left'] = 1;
  else if(dist < idealDist-18) input[dir>0?'left':'right'] = 1;

  // 4) 跳跃
  if(opp.y < me.y-28 && Math.random()<0.35) input.up = 1;
  // 空中追击
  if(!opp.onGround && dist<70 && Math.random()<0.4) input.up = 1;

  // 5) 普通攻击
  if(inHitboxRange && !me.atkPhase && me.aiDecision>0.75){
    if(dist<38) input.attack = 1;
    else input.heavy = 1;
  }
  // 下段
  if(inHitboxRange && opp.blocking && me.aiDecision>0.88){
    input.sweep = 1;
  }
  // 能量技 / 能量炮
  if(dist>70 && dist<320 && me.energy>=35 && me.aiDecision>0.9){
    if(me.energy>=50 && Math.random()<0.4) input.special = 1;
    else input.skill = 1;
  }

  // 6) 特殊技能量满就放
  if(me.energy>=95 && inHitboxRange) input.special = 1;

  return input;
}

/* ============================================================
   9. 游戏状态 + 输入
   ============================================================ */
let game = null;
let p1CharIdx = 1;  // 默认为平衡型 Ragna

function createGame(mode, seed, p1Idx, p2Idx){
  const idx1 = p1Idx!==undefined?p1Idx:p1CharIdx;
  const idx2 = p2Idx!==undefined?p2Idx:(Math.floor(Math.random()*CHARS.length));
  const p1 = new Mech({ x:80, y:0, dir:1, charIdx:idx1, name:'P1 '+CHARS[idx1].name, isAI:false });
  const p2 = new Mech({ x:W-90-MECH_W, y:0, dir:-1, charIdx:idx2, name:(mode==='ai'?'AI ':'P2 ')+CHARS[idx2].name, isAI:mode==='ai' });
  return {
    mode: mode,
    mechas: [p1, p2],
    beams: [],
    parts: [],
    floats: [],
    shake: 0,
    time: 0,
    remoteIndex: (mode==='online'&&seed===1)?1:-1,
    pvpConnected: false,
    ws: null,
    opponentInput: { left:0,right:0,up:0,down:0,attack:0,heavy:0,sweep:0,special:0,skill:0,roll:0 },
    training: false,
  };
}
function resetGame(){
  game = createGame(game?game.mode:'ai', 0);
  game.training = (game&&game.training)?true:false;
  updateStatusText();
}
function updateStatusText(){
  const el = document.getElementById('status');
  if(!game){ el.textContent='单人模式 (AI) · [T训练] [R重开]'; return; }
  let s = '';
  if(game.mode==='ai') s='单人模式 (AI)';
  else if(game.mode==='local') s='双人模式 (同屏)';
  else if(game.mode==='online') s='联机模式'+(game.pvpConnected?' (已连接)':' (匹配中...)');
  if(game.training) s += ' · 训练模式';
  s += ' · [T训练] [R重开]';
  el.textContent = s;
}

/* ===== 输入系统 ===== */
const keys = {};
const input1 = { left:0,right:0,up:0,down:0,attack:0,heavy:0,sweep:0,special:0,skill:0,roll:0 };
const input2 = { left:0,right:0,up:0,down:0,attack:0,heavy:0,sweep:0,special:0,skill:0,roll:0 };

document.addEventListener('keydown', e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key==='r'||e.key==='R') resetGame();
  if(e.key==='t'||e.key==='T'){
    if(game){ game.training=!game.training; updateStatusText(); }
  }
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  // 挥空音
  if((e.key==='j'||e.key==='J'||e.key==='h'||e.key==='H'||e.key==='u'||e.key==='U') && game && game.mechas[0] && !game.mechas[0].atkPhase) SFX.swing();
});
document.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });

function processInput(){
  // P1
  input1.left = keys['a']||keys['arrowleft']?1:0;
  input1.right= keys['d']||keys['arrowright']?1:0;
  input1.up   = keys['w']||keys['arrowup']?1:0;
  input1.down = keys['s']||keys['arrowdown']?1:0;
  input1.attack = keys['j']?1:0;
  input1.heavy  = keys['h']?1:0;
  input1.sweep  = keys['u']?1:0;
  input1.special= keys['k']?1:0;
  input1.skill  = keys['i']?1:0;
  input1.roll   = keys['l']?1:0;
  // P2 同屏
  input2.left = keys['4']?1:0;
  input2.right= keys['6']?1:0;
  input2.up   = keys['8']?1:0;
  input2.down = keys['5']?1:0;
  input2.attack = keys['1']?1:0;
  input2.heavy  = keys['2']?1:0;
  input2.sweep  = keys['3']?1:0;
  input2.special= keys['9']?1:0;
  input2.skill  = keys['0']?1:0;
  input2.roll   = keys['7']?1:0;
}

/* ===== 触控支持 ===== */
let touchMode = false;
const touchBtns = {};
function setupTouch(canvas){
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = W/rect.width, scaleY = H/rect.height;
    return {
      x: ((e.clientX!==undefined?e.clientX:e.touches[0].clientX) - rect.left)*scaleX,
      y: ((e.clientY!==undefined?e.clientY:e.touches[0].clientY) - rect.top)*scaleY,
    };
  }
  function down(e){
    e.preventDefault();
    if(!touchMode) return;
    const p = pos(e);
    // 左半屏: 方向
    if(p.x<W/2){
      if(p.y<H/3) { input1.up=1; touchBtns.up=true; }
      else if(p.y>H*2/3) { input1.down=1; touchBtns.down=true; }
      else if(p.x<W/4) { input1.left=1; touchBtns.left=true; }
      else { input1.right=1; touchBtns.right=true; }
    } else {
      // 6格: 上=重击 中上=特殊 中下=轻击 下=下段 左=翻滚 右=技能
      const rw = (W/2)/3, rh = H/3;
      const col = Math.floor((p.x-W/2)/rw);
      const row = Math.floor(p.y/rh);
      if(row===0 && col===1) { input1.heavy=1; touchBtns.heavy=true; }
      else if(row===1 && col===1){ input1.attack=1; touchBtns.attack=true; SFX.swing(); }
      else if(row===2 && col===1){ input1.sweep=1; touchBtns.sweep=true; }
      else if(row===1 && col===0){ input1.roll=1; touchBtns.roll=true; }
      else if(row===1 && col===2){ input1.skill=1; touchBtns.skill=true; }
      else if(row===0 && col===0){ input1.special=1; touchBtns.special=true; }
      else if(row===0 && col===2){ input1.up=1; touchBtns.up=true; }
    }
  }
  function up(e){ e.preventDefault(); releaseAllTouch(); }
  canvas.addEventListener('mousedown',down);
  canvas.addEventListener('mouseup',up);
  canvas.addEventListener('mouseleave',up);
  canvas.addEventListener('touchstart',down,{passive:false});
  canvas.addEventListener('touchend',up,{passive:false});
  canvas.addEventListener('touchcancel',up,{passive:false});
}
function releaseAllTouch(){
  for(const k of Object.keys(touchBtns)){
    input1[k] = 0;
  }
  for(const k in touchBtns) delete touchBtns[k];
}
setupTouch(canvas);
document.getElementById('modeBtn').addEventListener('click', ()=>{
  touchMode = !touchMode;
  document.getElementById('modeBtn').textContent = touchMode ? '触控: 开' : '触控: 关';
});

/* ===== 角色选择按钮 ===== */
document.querySelectorAll('#charSel button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#charSel button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    p1CharIdx = parseInt(btn.dataset.char);
    resetGame();
  });
});

/* ===== 联机 ===== */
let wsUrl = 'ws://'+window.location.hostname+':3000';
let pvpAttempted=false;
document.getElementById('pvpLink').addEventListener('click', e=>{
  e.preventDefault();
  if(pvpAttempted) return;
  pvpAttempted=true;
  connectPVP();
});
document.getElementById('resetLink').addEventListener('click', e=>{
  e.preventDefault();
  resetGame();
  if(game&&game.mode==='online'&&game.ws){ try{ game.ws.close(); }catch(e){} }
  pvpAttempted=false;
});
document.getElementById('trainLink').addEventListener('click', e=>{
  e.preventDefault();
  if(game){ game.training=!game.training; updateStatusText(); }
});
function connectPVP(){
  const status=document.getElementById('status');
  status.textContent='连接服务器中...';
  try {
    const ws = new WebSocket(wsUrl);
    ws.onopen = ()=>{ status.textContent='已连接，匹配中...'; ws.send(JSON.stringify({type:'match'})); };
    ws.onmessage = ev=>{ try{ const m=JSON.parse(ev.data); handleWSMessage(m,ws); }catch(e){} };
    ws.onclose = ()=>{
      if(game&&game.mode==='online'){
        game.pvpConnected=false;
        status.textContent='联机已断开 (回退AI)';
        game.mode='ai';
        game.mechas[1].isAI=true;
        game.mechas[1].name='AI '+CHARS[game.mechas[1].charIdx].name;
        updateStatusText();
      }
    };
    ws.onerror=()=>{ status.textContent='连接失败，单人模式'; if(game)game.mode='ai'; updateStatusText(); };
  } catch(e){ status.textContent='连接失败'; if(game)game.mode='ai'; updateStatusText(); }
}
function handleWSMessage(msg, ws){
  const status=document.getElementById('status');
  switch(msg.type){
    case 'queued':
      status.textContent=`匹配中 (位置${msg.position})`; break;
    case 'matched':
      status.textContent=`匹配成功 对手:${msg.opponentId}`;
      if(!game||game.mode!=='online'){
        game = createGame('online', msg.playerIndex);
        game.ws = ws; game.pvpConnected = true;
      } else {
        game.mode='online'; game.ws=ws; game.pvpConnected=true;
        game.mechas[1].isAI=false;
        game.mechas[1].name='对手 '+CHARS[game.mechas[1].charIdx].name;
      }
      updateStatusText();
      break;
    case 'remote_input':
      if(game&&game.opponentInput) game.opponentInput = msg.input || game.opponentInput;
      break;
    case 'opponent_left':
      status.textContent='对手离开';
      if(game){ game.mode='ai'; game.mechas[1].isAI=true; game.pvpConnected=false;
        game.mechas[1].name='AI '+CHARS[game.mechas[1].charIdx].name; }
      updateStatusText();
      break;
    case 'error': status.textContent='错误: '+msg.message; break;
  }
}

/* ============================================================
   10. 游戏主循环
   ============================================================ */
let lastTime = 0;
function gameLoop(ts){
  const dt = Math.min((ts-lastTime)/1000, 0.05);
  lastTime = ts;
  if(game){
    processInput();
    // 训练模式下: AI不攻击?  -> 可选: 这里AI仍然行动
    // 无限HP/能量
    if(game.training){
      game.mechas[0].hp = Math.min(game.mechas[0].maxhp, game.mechas[0].hp + dt*8);
      game.mechas[0].energy = Math.min(game.mechas[0].maxEnergy, game.mechas[0].energy + dt*40);
      game.mechas[1].hp = Math.min(game.mechas[1].maxhp, game.mechas[1].hp + dt*8);
      game.mechas[1].energy = Math.min(game.mechas[1].maxEnergy, game.mechas[1].energy + dt*40);
      game.mechas[0].dead = false;
      game.mechas[1].dead = false;
    }
    // 联机发输入
    if(game.mode==='online'&&game.ws&&game.pvpConnected){
      try{
        game.ws.send(JSON.stringify({
          type:'input', input:{
            left:input1.left,right:input1.right,up:input1.up,down:input1.down,
            attack:input1.attack,heavy:input1.heavy,sweep:input1.sweep,
            special:input1.special,skill:input1.skill,roll:input1.roll,
          }, seq:game.time
        }));
      }catch(e){}
    }
    const p1=game.mechas[0], p2=game.mechas[1];
    if(p1 && !p1.dead) p1.update(dt, input1, p2, game);
    if(p2){
      if(game.mode==='ai'){
        const ai = aiInput(p2, p1, dt, game);
        p2.update(dt, ai, p1, game);
      } else if(game.mode==='local'){
        p2.update(dt, input2, p1, game);
      } else if(game.mode==='online' && game.opponentInput){
        p2.update(dt, game.opponentInput, p1, game);
      } else {
        p2.update(dt, aiInput(p2,p1,dt,game), p1, game);
      }
    }
    // 光束
    for(let i=game.beams.length-1;i>=0;i--){
      game.beams[i].update(dt, game);
      if(game.beams[i].dead) game.beams.splice(i,1);
    }
    // 粒子
    for(let i=game.parts.length-1;i>=0;i--){
      game.parts[i].update(dt);
      if(game.parts[i].dead) game.parts.splice(i,1);
    }
    // 伤害浮字
    for(let i=game.floats.length-1;i>=0;i--){
      game.floats[i].update(dt);
      if(game.floats[i].dead) game.floats.splice(i,1);
    }
    // 震屏衰减
    if(game.shake>0) game.shake = Math.max(0, game.shake - dt*32);
    game.time += dt;
  }

  // === 渲染 ===
  ctx.save();
  if(game && game.shake>0){
    ctx.translate((Math.random()-0.5)*game.shake, (Math.random()-0.5)*game.shake);
  }
  ctx.fillStyle='#0a0a14';
  ctx.fillRect(-10,-10,W+20,H+20);
  drawBackground();

  if(game){
    // 光束
    for(const b of game.beams){
      ctx.fillStyle='#6cf';
      ctx.shadowColor='#6cf'; ctx.shadowBlur=10;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.shadowBlur=0;
    }
    // 机甲
    drawMech(game.mechas[0], game.training);
    if(!game.mechas[1].dead) drawMech(game.mechas[1], game.training);

    // 粒子
    for(const p of game.parts){
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x-p.s/2, p.y-p.s/2, p.s, p.s);
    }
    ctx.globalAlpha = 1;

    // 伤害浮字
    for(const f of game.floats){
      ctx.globalAlpha = f.alpha;
      ctx.fillStyle = f.color;
      ctx.font = `${f.weight||'bold'} ${f.size}px monospace`;
      ctx.textAlign = 'center';
      ctx.strokeStyle = 'rgba(0,0,0,0.8)';
      ctx.lineWidth = 3;
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha=1;

    // HUD
    drawHUD(game.mechas, game.remoteIndex);

    // 训练面板
    drawTrainingPanel(game);

    // 胜负
    drawResult(game.mechas);
  }
  ctx.restore();
  requestAnimationFrame(gameLoop);
}

// 响应式画布
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  const ratio = W/H;
  let cw = w, ch = w/ratio;
  if(ch>h){ ch=h; cw=h*ratio; }
  canvas.style.width = cw+'px';
  canvas.style.height = ch+'px';
}
window.addEventListener('resize', resize);
resize();

// 启动
game = createGame('ai', 0);
updateStatusText();
requestAnimationFrame(gameLoop);
</script>
